version: 2

models:
  - name: stg_shop__orders
    description: "Заказы из источника: одна строка — один заказ."
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests: [not_null]
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['paid', 'pending', 'returned', 'cancelled', 'test']
  - name: stg_shop__customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
  - name: stg_shop__order_items
    columns:
      - name: order_item_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests: [not_null]
  - name: stg_shop__payments
    columns:
      - name: payment_id
        data_tests: [unique, not_null]
      - name: payment_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['success', 'failed', 'pending']